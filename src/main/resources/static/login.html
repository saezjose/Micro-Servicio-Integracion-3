<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <!-- Bootstrap -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Roboto', sans-serif;
        }
    </style>
</head>
<body class="bg-light">

<!-- Barra superior blanca -->
<nav class="navbar navbar-light bg-white border-bottom py-2">
    <div class="container">
        <a class="navbar-brand" href="#">
            <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcTVr9h0RQJ-EZi6e1kG3smhuV4tpWRsq4_YoMrHod5DCh2etZfX"
                 alt="Logo" width="80" height="80">
        </a>
        <span class="navbar-text fw-bold">Sistema de Chat</span>
    </div>
</nav>

<!-- Línea tricolor -->
<div class="d-flex" style="height:5px; width:100%;">
    <div style="background-color:blue; width:10%;opacity:0.7;"></div>
    <div style="background-color:red; width:5%;opacity:0.7;"></div>
    <div style="background-color:blue; width:95%; opacity:0.3;"></div>
</div>

<!-- Formulario centrado -->
<div class="container d-flex justify-content-center align-items-center" style="min-height: 80vh;">
    <div class="card shadow-lg p-4" style="max-width: 400px; width: 100%;">
        <h3 class="text-center mb-4">Iniciar Sesión</h3>
        <form id="loginForm">
            <div class="mb-3">
                <label for="username" class="form-label">Correo electrónico</label>
                <input type="text" class="form-control" id="username" required>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label">Contraseña</label>
                <input type="password" class="form-control" id="password" required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Ingresar</button>
        </form>
        <p id="error" class="text-danger text-center mt-3"></p>
    </div>
</div>

<!-- Scripts -->
<script src="auth.js"></script>
<script>
    document.getElementById("loginForm").addEventListener("submit", login);
</script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
