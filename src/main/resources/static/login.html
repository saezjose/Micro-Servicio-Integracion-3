<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
</head>
<body>
<h2>Iniciar Sesión</h2>
<form id="loginForm">
    <label>Usuario:</label><br>
    <input type="text" id="username" required><br><br>

    <label>Contraseña:</label><br>
    <input type="password" id="password" required><br><br>

    <button type="submit">Ingresar</button>
</form>

<p id="error" style="color:red;"></p>

<script>
    const form = document.getElementById("loginForm");

    form.addEventListener("submit", async (e) => {
      e.preventDefault();

      const username = document.getElementById("username").value;
      const password = document.getElementById("password").value;

      try {
        const response = await fetch("http://localhost:8080/auth/login", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ username, password })
        });

        if (!response.ok) {
          document.getElementById("error").innerText = "Credenciales incorrectas";
          return;
        }

        const data = await response.json();

        // Guardamos token y rol en localStorage
        localStorage.setItem("token", data.token);
        localStorage.setItem("rol", data.rol);

        // Redirigir según rol
        if (data.rol === "CLIENTE") {
          window.location.href = "cliente.html";
        } else if (data.rol === "EMPRESA") {
          window.location.href = "empresa.html";
        } else {
          document.getElementById("error").innerText = "Rol no reconocido";
        }

      } catch (err) {
        document.getElementById("error").innerText = "Error de conexión con el servidor";
      }
    });
</script>
</body>
</html>
